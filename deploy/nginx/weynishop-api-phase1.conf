# =============================================================================
# WeyniShop API — PHASE 1 temporary vhost (port 80 only)
#
# Purpose: let certbot's webroot challenge succeed. The final vhost
# (weynishop-api.conf) can't be loaded until the certificate exists, because
# nginx refuses to start a server block whose ssl_certificate file is missing.
# This file answers http://api.weynishop.com/.well-known/acme-challenge/ so
# Let's Encrypt can validate the domain — instead of the server's default
# site (Edl Games) returning 404.
#
# INSTALL (on the VPS as root):
#   cp weynishop-api-phase1.conf /etc/nginx/sites-available/weynishop-api
#   ln -sf /etc/nginx/sites-available/weynishop-api /etc/nginx/sites-enabled/weynishop-api
#   mkdir -p /var/www/html
#   nginx -t && systemctl reload nginx
#
# THEN issue the certificate:
#   certbot certonly --webroot -w /var/www/html -d api.weynishop.com \
#     --email yaikobdereje@gmail.com --agree-tos -n
#
# After the cert exists, replace this file with the full vhost (Phase 2):
#   cp weynishop-api.conf /etc/nginx/sites-available/weynishop-api
#   nginx -t && systemctl reload nginx
#
# This file is intentionally minimal — upstream/proxying are not needed yet.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.weynishop.com;

    # certbot writes challenge files into /var/www/html/.well-known/acme-challenge/
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        # During Phase 1 there is no TLS yet, so just answer 503 instead of
        # redirecting to a https:// endpoint that would fail.
        return 503;
    }
}
