  <div id="root"></div>

  <script>
    // Splash logic
    // Rules:
    //   1. NATIVE APP ONLY (Capacitor). On the normal website — at any
    //      screen width — the splash is removed immediately: the website
    //      must show a normal page with no mobile intro (spec §31/§32).
    //      Detection uses the REAL Capacitor bridge object that Android
    //      injects before page scripts run — never window.innerWidth.
    //   2. In the native app the splash shows only on true app startup
    //      (once per session). If the WebView reloads mid-session
    //      (app resume, config change, etc.) the splash is skipped so
    //      the app never feels like it is restarting.
    //   3. On a real startup it shows for a short brand moment (MIN_MS)
    //      and hides as soon as React has painted real page content.

    (function () {
      var splash  = document.getElementById('weyn-splash');
      if (!splash) return;

      function hide(fast) {
        splash.classList.add('hide');
        setTimeout(function () {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, fast ? 150 : 600);
      }

      // WEBSITE (any browser, any width): no splash, ever.
      var isNative = false;
      try {
        isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform &&
                      window.Capacitor.isNativePlatform());
      } catch (e) { isNative = false; }
      if (!isNative) { hide(true); return; }

      // Once-per-session guard: sessionStorage survives WebView reloads
      // within the same app session but resets when the app process dies.
      var firstRun = true;
      try {
        firstRun = !sessionStorage.getItem('weynshop:splashShown');
        if (firstRun) sessionStorage.setItem('weynshop:splashShown', '1');
      } catch (e) { /* storage unavailable â€” show splash */ }

      if (!firstRun) { hide(true); return; }

      var MIN_MS   = 1200;          // short brand moment on cold start
      var start    = Date.now();
      var appReady = false;         // true once React has painted real content
      var timerDone = false;        // true once MIN_MS has elapsed

      function tryHide() {
        // Only hide when BOTH conditions are satisfied
        if (!appReady || !timerDone) return;
        hide(false);
      }

      // Minimum brand timer
      setTimeout(function () {
        timerDone = true;
        tryHide();
      }, MIN_MS);

      // Wait for React to render meaningful content inside #root.
      // We watch for a descendant that is NOT just an empty wrapper.
      // i.e. an element with visible text or a real child element.
      var root     = document.getElementById('root');
      var observer = new MutationObserver(function () {
        // Consider the app "ready" once #root has at least one child
        // element that itself has children (a real rendered page).
        var firstChild = root && root.firstElementChild;
        if (firstChild && firstChild.children.length > 0) {
          appReady = true;
          observer.disconnect();
          tryHide();
        }
      });
      observer.observe(root, { childList: true, subtree: true });
    })();
  </script>
