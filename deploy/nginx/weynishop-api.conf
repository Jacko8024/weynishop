# =============================================================================
# WeyniShop API — nginx vhost for api.weynishop.com
#
# WHY THIS FILE EXISTS
#   The VPS runs a plain nginx (1.24.0, Ubuntu) that hosts several sites.
#   Until now there was NO server block for api.weynishop.com, so nginx fell
#   back to its default vhost (the Edl Games betting site). That default:
#     * served the WRONG TLS certificate  -> browsers showed SSL errors and
#       blocked every API call from https://weynishop.com
#     * routed requests to the WRONG app  -> "Cannot GET /api/v1/..." 404s
#
#   This block makes api.weynishop.com a first-class vhost: it terminates TLS
#   with a Let's Encrypt certificate (via certbot) and proxies everything to
#   the WeyniShop API container (default port 3000; adjust if Coolify injects
#   a different port).
#
# INSTALL — TWO PHASES (full runbook in deploy/API_SSL_FIX.md):
#
#   PHASE 1 (port-80 only, so certbot's webroot challenge can succeed):
#     sed -n '/# BEGIN PHASE-1 MARKER/,/# END PHASE-1 MARKER/p' \
#       weynishop-api.conf > /etc/nginx/sites-available/weynishop-api
#     ln -sf /etc/nginx/sites-available/weynishop-api /etc/nginx/sites-enabled/
#     nginx -t && systemctl reload nginx
#     certbot certonly --webroot -w /var/www/html -d api.weynishop.com \
#       --email you@example.com --agree-tos -n
#
#   PHASE 2 (install the full file, enabling TLS):
#     cp weynishop-api.conf /etc/nginx/sites-available/weynishop-api
#     nginx -t && systemctl reload nginx
# =============================================================================

# --- Upstream: the WeyniShop API container -----------------------------------
# Coolify apps listen on a dynamically published host port. Find yours with:
#     docker ps --filter "name=weynishop-api" --format "{{.Names}} {{.Ports}}"
# or check the app's "Domains" page in the Coolify dashboard. 127.0.0.1:3000
# is the default; change it here if your container publishes another port.
upstream weynishop_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

# --- WebSocket connection upgrade map -----------------------------------------
# Must live in the http {} context. nginx loads sites-enabled/* from within
# http {}, so defining it here works. The '' fallback keeps ordinary requests
# (no Upgrade header) on a normal connection. Unique variable name avoids
# collisions with other vhosts on this shared server.
map $http_upgrade $weynishop_api_connection_upgrade {
    default upgrade;
    ''      close;
}

# --- BEGIN PHASE-1 MARKER -------------------------------------------------------
# Everything between the markers is the temporary port-80-only vhost used
# while issuing the certificate. certbot's webroot challenge needs a server
# answering http://api.weynishop.com/.well-known/acme-challenge/ on port 80.
server {
    listen 80;
    listen [::]:80;
    server_name api.weynishop.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
# --- END PHASE-1 MARKER ---------------------------------------------------------

server {
    # NOTE: nginx 1.24.0 does NOT support the standalone `http2 on;`
    # directive (that arrived in 1.25.1). Use the listen-flag form instead.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.weynishop.com;

    # --- TLS certificate (Let's Encrypt via certbot) -------------------------
    ssl_certificate     /etc/letsencrypt/live/api.weynishop.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.weynishop.com/privkey.pem;

    # --- Modern TLS only ------------------------------------------------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL_API 10m;
    ssl_session_tickets off;

    # --- Security headers (the API sets its own via helmet; kept minimal) ----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # --- Uploads: match the API's upload limits -------------------------------
    # platform/server/src/routes/v1/upload.routes.js accepts images/docs; raise
    # these if you increase the limits in the API itself.
    client_max_body_size 25m;

    # --- Proxy to the API ------------------------------------------------------
    location / {
        proxy_pass http://weynishop_api;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # --- Socket.io / WebSockets (order-tracking live updates) -----------
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $weynishop_api_connection_upgrade;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
        proxy_buffering off;
    }

    # --- Static uploads served straight from disk (optional fast-path) -------
    # Uncomment ONLY if you bind-mount the api container's uploads volume to
    # the host (e.g. /srv/weynishop/uploads:/app/uploads). Otherwise leave
    # commented and let the API serve them itself.
    # location /uploads/ {
    #     alias /srv/weynishop/uploads/;
    #     expires 30d;
    #     add_header Cache-Control "public, immutable";
    # }
}
